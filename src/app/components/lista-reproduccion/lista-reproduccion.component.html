<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Mi App de Música</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Buscador con ngModel -->
  <ion-searchbar
    [(ngModel)]="searchTerm"
    (ionInput)="buscar()"
    [debounce]="500"
    placeholder="Busca un artista, álbum o canción...">
  </ion-searchbar>

  <!-- Lista de resultados -->
  <ion-list>
    <ion-item *ngFor="let track of tracks">
      <ion-avatar slot="start">
        <img [src]="track.album.cover_medium" alt="Carátula" />
      </ion-avatar>

      <ion-label>
        <h2>{{ track.title }}</h2>
        <p>{{ track.artist.name }}</p>
      </ion-label>

      <ion-button slot="end" fill="clear" (click)="playPreview(track)">
        {{ playingTrackId === track.id ? '⏸️' : '▶️' }}
      </ion-button>
    </ion-item>
  </ion-list>

</ion-content>
